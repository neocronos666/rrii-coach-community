[project]
name = "rrii-coach-backend"
version = "0.1.0"
description = "Backend Community de RRII-Coach"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.139,<0.140",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0.51,<2.2",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.7,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
cache_dir = "/tmp/pytest_cache"
markers = [
    "integration: requiere una instancia PostgreSQL aislada",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
cache-dir = "/tmp/ruff_cache"
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.mypy]
cache_dir = "/tmp/mypy_cache"
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
