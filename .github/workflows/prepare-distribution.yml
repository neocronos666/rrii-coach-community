name: Preparar distribución sin publicar
on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión candidata explícita
        required: true
        default: 0.1.0-rc1
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RRII_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Verificar aplicación completa antes del empaquetado
        run: ./scripts/check-local.sh
      - name: Construir imágenes y paquete locales
        run: python3 scripts/build-distribution.py --version "$RRII_RELEASE_VERSION" --build-images
      - name: Probar el artefacto fuera del checkout
        run: python3 scripts/check-distribution.py "dist/rrii-coach-community-$RRII_RELEASE_VERSION-linux-amd64.tar.gz"
      - name: Conservar paquete para revisión (sin Release ni registry)
        uses: actions/upload-artifact@v7
        with:
          name: community-distribution-candidate
          path: dist/*
          if-no-files-found: error
      - name: Conservar resultados automatizados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: distribution-checks
          path: reports/checks/
          if-no-files-found: ignore
